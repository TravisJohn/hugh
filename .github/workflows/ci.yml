name: CI

# The release gate specified in DEPLOYMENT_READINESS_AUDIT.md ("Proposed CI
# release gate"). Every step here passes locally; this makes that continuous
# rather than a thing someone remembers to check.
#
# Deliberately needs NO secrets. The production build was made independent of
# environment variables so this workflow can run on a bare checkout, including
# from a fork. If a step here ever starts needing a key, fix the code rather
# than adding the key.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  storage-security:
    name: Storage ownership and database permissions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hugh_s1_security_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Copy SQL fixtures to isolated database
        run: docker cp supabase "${{ job.services.postgres.id }}:/tmp/hugh-s1"
      - name: Test storage reference permissions with two synthetic tenants
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -d hugh_s1_security_test -f /tmp/hugh-s1/tests/053_storage_references.sql
      - name: Create disposable text-budget database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres hugh_s2_security_test
      - name: Test concurrent prompt-sized reservations
        run: docker exec -e PGUSER=postgres -e PGDATABASE=hugh_s2_security_test "${{ job.services.postgres.id }}" sh /tmp/hugh-s1/tests/s2_text_budget.sh
      - name: Create disposable reservation-lifetime database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres hugh_s4_security_test
      - name: Test per-request reservation expiry
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -d hugh_s4_security_test -f /tmp/hugh-s1/tests/054_usage_reservation_lifetime.sql

  verify:
    name: lint · typecheck · test · audit · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Node 20 is the floor declared in package.json engines (and Next's own
      # minimum). Running the gate here proves that claim stays honest, since
      # local development happens on a much newer Node.
      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - name: Install (locked)
        run: npm ci

      # lib/architecture/data.generated.json is build output and is gitignored,
      # but two API routes import it, so lint and typecheck need it to exist on
      # a bare checkout. `npm run build` generates it via prebuild, which is too
      # late: typecheck runs first. Generating it up front rather than
      # committing the artifact keeps it a build product.
      - name: Generate architecture data
        run: node tools/architecture-dashboard/scripts/build-hosted.js

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      # Cloud Skills content is hand- and AI-edited JSON that nothing type-checks
      # at runtime (the loader casts). This is the only thing standing between a
      # bad edit and a broken service page.
      - name: Cloud content integrity
        run: npm run cloud:check

      - name: Unit tests
        run: npm test

      # Production dependencies only. Dev-only advisories should not gate a
      # release, but a high-severity issue in shipped code should.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Runs the architecture-dashboard prebuild too, so that stays wired up.
      - name: Production build
        run: npm run build
